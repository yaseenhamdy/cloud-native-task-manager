name: dev-test-infra
on: 
#   push:
#    paths:
#      - 'terraform/**'
#    branches:
#      - main
#      - feature/multi-eks-cluster
  workflow_dispatch:

  workflow_run:
    workflows:
      - shared-infra
    types: [completed]
    branches:
      - main
      - feature/argoCD



env:
  AWS_REGION: us-east-1
  TF_VAR_machine_public_IP: ${{secrets.MACHINE_PUBLIC_IP}}
  TF_VAR_bastion_public_key: ${{ secrets.BASTION_PUBLIC_KEY }}

jobs:
  

 terraform-stage-1:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       
   

    - name: terraform init dev-test env
      working-directory: ./terraform/environments/dev-test
      run: terraform init       


    - name: terraform apply dev-test env (stage 1)
      working-directory: ./terraform/environments/dev-test
      run: terraform apply -auto-approve -target=module.vpc -var-file=main.tfvars
      
 terraform-stage-2:
  if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
  runs-on: ubuntu-latest
  needs: terraform-stage-1
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       
   

    - name: terraform init dev-test env
      working-directory: ./terraform/environments/dev-test
      run: terraform init       


    - name: Clear orphaned EKS leftovers
      run: |
        CLUSTER=dev-test-cluster
        STATUS=$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.status' --output text 2>/dev/null || echo NOT_FOUND)
        echo "EKS cluster status: $STATUS"
        if [ "$STATUS" = "NOT_FOUND" ]; then
          echo "Cluster gone - clearing orphaned leftovers"
          aws kms delete-alias --alias-name "alias/eks/$CLUSTER" || true
          aws logs delete-log-group --log-group-name "/aws/eks/$CLUSTER/cluster" || true
        else
          echo "Cluster exists - skipping cleanup"
        fi

    - name: terraform apply dev-test env (stage 2)
      working-directory: ./terraform/environments/dev-test
      run: terraform apply -auto-approve -target=module.eks -target=module.irsa -var-file=main.tfvars
      
 terraform-final-stage:
  runs-on: ubuntu-latest
  needs: terraform-stage-2
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       
       

    - name: terraform init
      working-directory: ./terraform/environments/dev-test
      run: terraform init            

    - name: Detect ArgoCD integration availability
      id: argocd_integration
      run: |
        ENABLE=false
        if aws s3api head-object --bucket tasker-app-terraform-state --key tools/terraform.tfstate >/dev/null 2>&1; then
          if aws s3 cp "s3://tasker-app-terraform-state/tools/terraform.tfstate" - 2>/dev/null | grep -q "argo_cd_irsa_role_arn"; then
            ENABLE=true
          fi
        fi
        echo "enabled=$ENABLE" >> "$GITHUB_OUTPUT"

    - name: terraform entire apply
      working-directory: ./terraform/environments/dev-test
      run: terraform apply -auto-approve -var-file=main.tfvars -var "enable_argocd_integration=${{ steps.argocd_integration.outputs.enabled }}"

  
    