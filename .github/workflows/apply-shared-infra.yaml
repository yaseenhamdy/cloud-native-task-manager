name: shared-infra
on: 
  push:
   paths:
     - 'terraform/**'
   branches:
     - main
     - feature/argoCD
  workflow_dispatch:
  

env:
  AWS_REGION: us-east-1
  TF_VAR_machine_public_IP: ${{secrets.MACHINE_PUBLIC_IP}}
  TF_VAR_bastion_public_key: ${{ secrets.BASTION_PUBLIC_KEY }}

jobs:

 terraform-bootstrap-state:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Bootstrap terraform state backend
      run: bash scripts/bootstrap-tf-state.sh

 terraform-apply-shared:
  runs-on: ubuntu-latest
  needs: terraform-bootstrap-state
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       
   

    - name: Clear secrets stuck in pending deletion
      run: |
        for s in postgres_secrets prometheus_secrets grafana_secrets; do
          deleted=$(aws secretsmanager describe-secret --secret-id "$s" \
            --query 'DeletedDate' --output text 2>/dev/null || echo None)
          if [ "$deleted" != "None" ]; then
            echo "Secret $s is pending deletion - force deleting"
            aws secretsmanager delete-secret --secret-id "$s" --force-delete-without-recovery || true
          else
            echo "Secret $s not found or active - skipping"
          fi
        done

    - name: terraform init shared env
      working-directory: ./terraform/environments/shared
      run: terraform init       


    - name: terraform apply shared env 
      working-directory: ./terraform/environments/shared
      run: terraform apply -auto-approve 


 aws-secret:
  runs-on: ubuntu-latest
  needs: terraform-apply-shared
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{env.AWS_REGION}}      

    - name: Put AWS secrets
      run: |
        aws secretsmanager put-secret-value \
        --secret-id "postgres_secrets" \
        --secret-string "{
          \"POSTGRES_USER\": \"${{ secrets.POSTGRES_USER }}\",
          \"POSTGRES_PASSWORD\": \"${{ secrets.POSTGRES_PASSWORD }}\",
          \"POSTGRES_DB\": \"${{ secrets.POSTGRES_DB }}\",
          \"DATABASE_URL\": \"${{ secrets.DATABASE_URL }}\"
        }"       


    - name: Ensure prometheus_secrets exists
      run: |
        aws secretsmanager create-secret \
        --name prometheus_secrets \
        --secret-string '{"username":"","password":"","web-config":""}' || true

    - name: Put Prometheus secrets
      env:
        PROM_USER: ${{ secrets.PROMETHEUS_USERNAME }}
        PROM_PASS: ${{ secrets.PROMETHEUS_PASSWORD }}
      run: |
        sudo apt-get update
        sudo apt-get install -y apache2-utils
        HASH=$(htpasswd -nbBC 12 "" "$PROM_PASS" | tr -d ':\n')
        WEB_CONFIG=$(printf 'basic_auth_users:\n  %s: %s\n' "$PROM_USER" "$HASH")
        aws secretsmanager put-secret-value \
        --secret-id "prometheus_secrets" \
        --secret-string "$(jq -n --arg u "$PROM_USER" --arg p "$PROM_PASS" --arg wc "$WEB_CONFIG" \
          '{username:$u, password:$p, "web-config":$wc}')"

    - name: Ensure grafana_secrets exists
      run: |
        aws secretsmanager create-secret \
        --name grafana_secrets \
        --secret-string '{"admin-user":"","admin-password":""}' || true

    - name: Put Grafana secrets
      run: |
        aws secretsmanager put-secret-value \
        --secret-id "grafana_secrets" \
        --secret-string "{
          \"admin-user\": \"${{ secrets.GRAFANA_ADMIN_USER }}\",
          \"admin-password\": \"${{ secrets.GRAFANA_ADMIN_PASSWORD }}\"
        }"

        
 terraform-apply-tools-stage-1:
  runs-on: ubuntu-latest
  needs: terraform-bootstrap-state
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Clear orphaned EKS leftovers
      run: |
        CLUSTER=tools-cluster
        STATUS=$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.status' --output text 2>/dev/null || echo NOT_FOUND)
        echo "EKS cluster status: $STATUS"
        if [ "$STATUS" = "NOT_FOUND" ]; then
          echo "Cluster gone - clearing orphaned leftovers"
          aws kms delete-alias --alias-name "alias/eks/$CLUSTER" || true
          aws logs delete-log-group --log-group-name "/aws/eks/$CLUSTER/cluster" || true
        else
          echo "Cluster exists - skipping cleanup"
        fi

    - name: terraform init tools env
      working-directory: ./terraform/environments/tools
      run: terraform init

    - name: terraform apply tools env (stage 1 - vpc + eks)
      working-directory: ./terraform/environments/tools
      run: terraform apply -auto-approve -target=module.vpc -target=module.eks -var-file=main.tfvars

 terraform-apply-tools-stage-2:
  runs-on: ubuntu-latest
  needs: terraform-apply-tools-stage-1
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init tools env
      working-directory: ./terraform/environments/tools
      run: terraform init

    - name: terraform apply tools env (stage 2 - irsa + argocd chart)
      working-directory: ./terraform/environments/tools
      run: terraform apply -auto-approve -target=module.argo-CD-irsa -target=module.irsa -target=module.service_accounts -target=module.argoCD_chart -var-file=main.tfvars

 argocd-bootstrap:
  runs-on: ubuntu-latest
  needs: terraform-apply-tools-stage-2
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl && sudo mv kubectl /usr/local/bin/

    - name: Connect to tools-cluster
      run: aws eks update-kubeconfig --name tools-cluster --region us-east-1

    - name: Apply app-of-apps conditionally
      run: |
        python3 - <<'EOF'
        import yaml, glob, subprocess

        def cluster_exists(name):
            return subprocess.run(
                ["aws", "eks", "describe-cluster", "--name", name],
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
            ).returncode == 0

        for f in sorted(glob.glob("k8s/app-of-apps/*.yaml")):
            dest = yaml.safe_load(open(f))["spec"]["destination"]
            if "server" in dest:
                ok = True
            else:
                ok = cluster_exists(dest.get("name", ""))
            print(("APPLY " if ok else "SKIP  ") + f + " -> " + str(dest))
            if ok:
                subprocess.run(["kubectl", "apply", "-f", f], check=True)
        EOF