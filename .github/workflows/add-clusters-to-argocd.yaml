name: add-to-argocd-cluster
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VAR_machine_public_IP: ${{ secrets.MACHINE_PUBLIC_IP }}
  TF_VAR_bastion_public_key: ${{ secrets.BASTION_PUBLIC_KEY }}

jobs:

 terraform-add-clusters:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       

    - name: terraform init tools env
      working-directory: ./terraform/environments/tools
      run: terraform init

    - name: Detect existing clusters
      id: detect
      run: |
        PROD=false
        DEVTEST=false
        aws eks describe-cluster --name prod-cluster >/dev/null 2>&1 && PROD=true || true
        aws eks describe-cluster --name dev-test-cluster >/dev/null 2>&1 && DEVTEST=true || true
        echo "prod=$PROD" >> "$GITHUB_OUTPUT"
        echo "devtest=$DEVTEST" >> "$GITHUB_OUTPUT"

    - name: terraform apply argo_cd_add_clusters
      working-directory: ./terraform/environments/tools
      run: |
        terraform apply -auto-approve -target=module.argo_cd_add_clusters \
          -var-file=main.tfvars \
          -var "register_prod=${{ steps.detect.outputs.prod }}" \
          -var "register_devtest=${{ steps.detect.outputs.devtest }}"