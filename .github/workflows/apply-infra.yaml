 terraform-stage-1:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       
   

    - name: terraform init
      working-directory: ./terraform/environments/dev
      run: terraform init       

    - name: terraform apply (stage 1)
      working-directory: ./terraform/environments/dev
      run: terraform apply -auto-approve -target=module.vpc -target=module.secret_manager

 aws-secret:
  runs-on: ubuntu-latest
  needs: terraform-stage-1
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{env.AWS_REGION}}      

    - name: Put AWS secrets
      run: |
        aws secretsmanager put-secret-value \
        --secret-id "postgres_secrets" \
        --secret-string "{
          \"POSTGRES_USER\": \"${{ secrets.POSTGRES_USER }}\",
          \"POSTGRES_PASSWORD\": \"${{ secrets.POSTGRES_PASSWORD }}\",
          \"POSTGRES_DB\": \"${{ secrets.POSTGRES_DB }}\",
          \"DATABASE_URL\": \"${{ secrets.DATABASE_URL }}\"
        }"       


 terraform-stage-2:
  runs-on: ubuntu-latest
  needs: aws-secret
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       

    - name: terraform init
      working-directory: ./terraform/environments/dev
      run: terraform init      

    - name: terraform apply (stage 2)
      working-directory: ./terraform/environments/dev
      run: terraform apply -auto-approve -target=module.eks -target=module.irsa 

 terraform-final-stage:
  runs-on: ubuntu-latest
  needs: terraform-stage-2
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}       
       

    - name: terraform init
      working-directory: ./terraform/environments/dev
      run: terraform init            

    - name: terraform entire apply 
      working-directory: ./terraform/environments/dev
      run: terraform apply -auto-approve 

  
    