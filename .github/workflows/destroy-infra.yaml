name: destroy-all

on:
 workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VAR_machine_public_IP: ${{secrets.MACHINE_PUBLIC_IP}}
  TF_VAR_bastion_public_key: ${{ secrets.BASTION_PUBLIC_KEY }}

jobs:

 terraform-remove-argocd-clusters:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/tools
      run: terraform init

    - name: terraform destroy argo_cd_add_clusters
      working-directory: ./terraform/environments/tools
      run: terraform destroy -auto-approve -target=module.argo_cd_add_clusters -var-file=main.tfvars

 terraform-dev-test-destroy:
  runs-on: ubuntu-latest
  needs: terraform-remove-argocd-clusters
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for dev-test
      run: aws eks update-kubeconfig --name dev-test-cluster --region ${{ env.AWS_REGION }}

    - name: Uninstall Helm releases manually
      run: |
        helm uninstall aws-load-balancer-controller -n kube-system || true
        helm uninstall external-secrets -n external-secrets || true

    - name: terraform init
      working-directory: ./terraform/environments/dev-test
      run: terraform init

    - name: terraform dev-test destroy
      working-directory: ./terraform/environments/dev-test
      run: terraform destroy -auto-approve -var-file=main.tfvars

 terraform-prod-destroy:
  runs-on: ubuntu-latest
  needs: terraform-remove-argocd-clusters
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for prod
      run: aws eks update-kubeconfig --name prod-cluster --region ${{ env.AWS_REGION }}

    - name: Uninstall Helm releases manually
      run: |
        helm uninstall aws-load-balancer-controller -n kube-system || true
        helm uninstall external-secrets -n external-secrets || true

    - name: terraform init
      working-directory: ./terraform/environments/prod
      run: terraform init

    - name: terraform prod destroy
      working-directory: ./terraform/environments/prod
      run: terraform destroy -auto-approve -var-file=main.tfvars

 terraform-shared-destroy:
  runs-on: ubuntu-latest
  needs: [terraform-dev-test-destroy, terraform-prod-destroy]
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/shared
      run: terraform init

    - name: terraform shared destroy
      working-directory: ./terraform/environments/shared
      run: terraform destroy -auto-approve -var-file=main.tfvars