name: destroy-all

on:
 workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VAR_machine_public_IP: ${{secrets.MACHINE_PUBLIC_IP}}
  TF_VAR_bastion_public_key: ${{ secrets.BASTION_PUBLIC_KEY }}

jobs:

 argocd-cleanup:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Clean up ArgoCD applications and leftover load balancers
      run: bash scripts/destroy-project.sh

 terraform-remove-argocd-clusters:
  runs-on: ubuntu-latest
  needs: argocd-cleanup
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/tools
      run: terraform init

    - name: terraform destroy argo_cd_add_clusters
      working-directory: ./terraform/environments/tools
      run: terraform destroy -auto-approve -target=module.argo_cd_add_clusters -var-file=main.tfvars

 terraform-dev-test-destroy:
  runs-on: ubuntu-latest
  needs: terraform-remove-argocd-clusters
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/dev-test
      run: terraform init

    - name: terraform dev-test destroy
      working-directory: ./terraform/environments/dev-test
      run: terraform destroy -auto-approve -var-file=main.tfvars

 terraform-prod-destroy:
  runs-on: ubuntu-latest
  needs: terraform-remove-argocd-clusters
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/prod
      run: terraform init

    - name: terraform prod destroy
      working-directory: ./terraform/environments/prod
      run: terraform destroy -auto-approve -var-file=main.tfvars

 terraform-tools-destroy:
  runs-on: ubuntu-latest
  needs: [terraform-dev-test-destroy, terraform-prod-destroy]
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/tools
      run: terraform init

    - name: terraform tools destroy
      working-directory: ./terraform/environments/tools
      run: terraform destroy -auto-approve -var-file=main.tfvars

 terraform-shared-destroy:
  runs-on: ubuntu-latest
  needs: terraform-tools-destroy
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Terraform Setup action
      uses: ./.github/actions/terraform-setup
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: terraform init
      working-directory: ./terraform/environments/shared
      run: terraform init

    - name: terraform shared destroy
      working-directory: ./terraform/environments/shared
      run: terraform destroy -auto-approve -var-file=main.tfvars

 aws-secrets-delete:
  runs-on: ubuntu-latest
  needs: terraform-shared-destroy
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Delete prometheus_secrets
      run: |
        aws secretsmanager delete-secret \
        --secret-id prometheus_secrets \
        --force-delete-without-recovery || true

    - name: Delete grafana_secrets
      run: |
        aws secretsmanager delete-secret \
        --secret-id grafana_secrets \
        --force-delete-without-recovery || true

 destroy-tf-state:
  runs-on: ubuntu-latest
  needs: [terraform-shared-destroy, aws-secrets-delete]
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ env.AWS_REGION }}

    - name: Delete terraform state backend (S3 + DynamoDB)
      run: |
        aws s3 rm s3://tasker-app-terraform-state --recursive
        aws s3api delete-bucket --bucket tasker-app-terraform-state
        aws dynamodb delete-table --table-name lock-state