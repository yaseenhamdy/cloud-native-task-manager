apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: yaseenhamdii/reactapp:v8
        imagePullPolicy: Always