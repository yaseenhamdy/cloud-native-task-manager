apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset

spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db

  serviceName: "postgres-service"

  minReadySeconds: 10

  template:
    metadata:
      labels:
        app: postgres-db

    spec:
      terminationGracePeriodSeconds: 10

      containers:
        - name: postgres-container
          image: postgres:15

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_DB

          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-volume

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: db-storageclass

        resources:
          requests:
            storage: 1Gi
