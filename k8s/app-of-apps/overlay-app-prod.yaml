apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-overlay
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/yaseenhamdy/cloud-native-task-manager.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    name: prod-cluster
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true