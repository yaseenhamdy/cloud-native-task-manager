apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: 'https://github.com/yaseenhamdy/cloud-native-task-manager.git'
    targetRevision: HEAD
    path: k8s/charts/promethus-grafana-eso/grafana-eso.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true