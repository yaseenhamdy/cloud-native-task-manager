apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-prometheus-remote-write-secret
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: 'https://github.com/yaseenhamdy/cloud-native-task-manager.git'
    targetRevision: HEAD
    path: k8s/charts/promethus-grafana-eso/prometheus-eso.yaml
  destination:
    name: prod-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true