apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools-infra
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/yaseenhamdy/cloud-native-task-manager.git
    targetRevision: HEAD
    path: k8s/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true