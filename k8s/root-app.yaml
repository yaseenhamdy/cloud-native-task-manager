apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/yaseenhamdy/cloud-native-task-manager.git
    targetRevision: HEAD
    path: k8s/app-of-apps
  destination:
    server: https://kubernetes.default.svc  
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true